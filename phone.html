<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maze</title>
  <!-- Firebase loads straight from Google, so there's no build step -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app":      "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js",
        "firebase/auth":     "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js"
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #f5f0e8;
      font-family: Georgia, 'Times New Roman', serif;
      color: #111;
    }

    /* ── Game canvas layout ──────────────────────────────────────── */

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
    }

    #maze-canvas {
      display: block;
      touch-action: none;
    }

    #pad-canvas {
      display: block;
      touch-action: none;
      flex-shrink: 0;
    }

    /* ── Shared screen styles ────────────────────────────────────── */

    .screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f0e8;
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .screen.visible {
      display: flex;
    }

    .screen-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .screen-label {
      font-size: 2rem;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    .screen-body {
      font-size: 1.25rem;
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    /* Name input */
    .screen-inner input[type=text] {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.5rem;
      background: none;
      border: none;
      border-bottom: 1px solid #111;
      color: #111;
      text-align: center;
      width: 100%;
      max-width: 300px;
      padding: 0.5rem 0;
      outline: none;
      border-radius: 0;
    }
    .screen-inner input[type=text]::placeholder {
      color: #aaa;
    }

    /* Primary button */
    .screen-inner button {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1rem;
      background: none;
      border: 1px solid #111;
      color: #111;
      padding: 0.75rem 2.5rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .screen-inner button:active {
      background: #111;
      color: #f5f0e8;
    }

    /* Ghost/secondary button */
    .btn-ghost {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.9rem;
      background: none;
      border: none !important;
      color: #888 !important;
      padding: 0.5rem 1rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: underline;
    }
    .btn-ghost:active {
      color: #111 !important;
      background: none !important;
    }

    /* ── Solo win overlay (kept for ?solo mode) ──────────────────── */

    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f0e8;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      z-index: 100;
    }
    #win-overlay.visible {
      display: flex;
    }
    #win-overlay p {
      font-size: 2rem;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 0 2rem;
      line-height: 1.4;
    }
    #win-overlay button {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1rem;
      background: none;
      border: 1px solid #111;
      color: #111;
      padding: 0.75rem 2rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    #win-overlay button:active {
      background: #111;
      color: #f5f0e8;
    }

    /* ── Tuning panel ────────────────────────────────────────────── */

    #tuning-panel {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 260px;
      max-height: 100vh;
      overflow-y: auto;
      background: #fff;
      border-left: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
      padding: 12px;
      z-index: 200;
      font-family: monospace;
      font-size: 12px;
      color: #111;
    }
    #tuning-panel.visible {
      display: block;
    }
    #tuning-panel label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 10px;
    }
    #tuning-panel input[type=range] {
      width: 100%;
    }
    #tuning-panel input[type=number],
    #tuning-panel input[type=text] {
      width: 100%;
      font-family: monospace;
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #aaa;
    }
    #tuning-panel button {
      font-family: monospace;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      border: 1px solid #aaa;
      background: #f0f0f0;
      margin-top: 4px;
      width: 100%;
    }
    #tuning-panel h3 {
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 10px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- ── Game canvas (solo and multiplayer) ───────────────────────── -->
  <div id="app">
    <canvas id="maze-canvas"></canvas>
    <canvas id="pad-canvas"></canvas>
  </div>

  <!-- ── Solo win overlay ─────────────────────────────────────────── -->
  <div id="win-overlay">
    <p>You found someone.</p>
    <button id="new-maze-btn">New maze</button>
  </div>

  <!-- ── Multiplayer screens ──────────────────────────────────────── -->
  <!-- Game lives in #app behind these overlays; hideAllScreens() reveals it -->
  <div id="screen-entry"        class="screen"></div>
  <div id="screen-waiting"      class="screen"></div>
  <div id="screen-instructions" class="screen"></div>
  <div id="screen-round2"       class="screen"></div>
  <div id="screen-group"        class="screen"></div>
  <div id="screen-message"      class="screen"></div>
  <!-- ── Tuning panel (solo mode only) ────────────────────────────── -->
  <div id="tuning-panel">
    <h3>Tuning</h3>

    <label>Grid size: <span id="lbl-grid"></span>
      <input type="range" id="sl-grid" min="5" max="30" step="1" />
    </label>
    <label>Wall thickness: <span id="lbl-wall"></span>
      <input type="range" id="sl-wall" min="1" max="8" step="0.5" />
    </label>
    <label>Ball size (fraction of a cell): <span id="lbl-ball"></span>
      <input type="range" id="sl-ball" min="0.1" max="0.45" step="0.01" />
    </label>
    <label>Speed (cells/s): <span id="lbl-speed"></span>
      <input type="range" id="sl-speed" min="2" max="15" step="0.1" />
    </label>
    <label>Friction (0–1): <span id="lbl-friction"></span>
      <input type="range" id="sl-friction" min="0.5" max="0.999" step="0.001" />
    </label>
    <label>Visible radius (px, 0=unlimited): <span id="lbl-vis"></span>
      <input type="range" id="sl-vis" min="20" max="800" step="5" />
    </label>

    <label>Seed:
      <input type="text" id="inp-seed" />
    </label>
    <button id="btn-new">New maze</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
